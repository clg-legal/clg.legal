<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Forms</title>
  </head>
  <body>
    <!-- Статична реєстрація Netlify Forms. Поля мають збігатися з формами на сайті. -->
    <form name="contact" method="POST" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="hidden" name="page" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="person-type" />
      <input type="checkbox" name="agree" value="yes" />
    </form>

    <form name="hero-callback" method="POST" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="hero-callback" />
      <input type="hidden" name="page" />
      <input name="bot-field" />
      <input type="tel" name="phone" />
    </form>
  </body>
</html>
