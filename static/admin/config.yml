backend:
  name: github
  repo: clg-legal/clg.legal
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Працює лише на localhost: запускається разом із `npx decap-server`
local_backend: true

locale: uk
site_url: https://clg.legal
display_url: https://clg.legal
logo_url: /images/logo.png

media_folder: static/images
public_folder: /images

collections:
  - name: blog
    label: Блог
    label_singular: Публікація
    folder: content/blog
    create: true
    # Кожен пост — page bundle: content/blog/<slug>/index.md, картинки лежать поруч
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    slug: "{{fields.slug}}"
    extension: md
    format: yaml-frontmatter
    sortable_fields: ["date", "title"]
    summary: "{{date}} — {{title}}"
    fields:
      - { label: Заголовок, name: title, widget: string }
      - label: Slug (адреса сторінки)
        name: slug
        widget: string
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Тільки латиниця, цифри та дефіси"]
        hint: "Латиницею через дефіс, наприклад: advokat-u-kyievi. Для вже опублікованих постів не змінювати — зміниться URL."
      - { label: Короткий опис, name: description, widget: text }
      - { label: Обкладинка, name: image, widget: image, required: false }
      - label: Дата публікації
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - label: Категорія
        name: category
        widget: relation
        collection: categories
        search_fields: ["title"]
        value_field: slug
        display_fields: ["title"]
        multiple: true
        hint: "Нову категорію можна створити в розділі «Категорії» зліва."
      - { label: Автор, name: author, widget: string, default: "CONCORDIS LEGAL GROUP" }
      - { label: Чернетка, name: draft, widget: boolean, default: false, required: false }
      - label: SEO
        name: seo
        widget: object
        collapsed: true
        fields:
          - { label: SEO title, name: title, widget: string, required: false }
          - { label: SEO description, name: description, widget: text, required: false }
          - label: Robots
            name: robots
            widget: select
            options: ["index, follow", "noindex, nofollow"]
            default: "index, follow"
            required: false
      - { label: Текст, name: body, widget: markdown }

  - name: categories
    label: Категорії
    label_singular: Категорія
    folder: content/category
    create: true
    # Кожна категорія — content/category/<slug>/_index.md
    path: "{{slug}}/_index"
    slug: "{{fields.slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    fields:
      - { label: Назва, name: title, widget: string }
      - label: Slug (адреса сторінки)
        name: slug
        widget: string
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Тільки латиниця, цифри та дефіси"]
        hint: "Латиницею через дефіс, наприклад: podatkovi-spory. Для наявних категорій не змінювати — зміниться URL і зламаються звʼязки з публікаціями."
      - label: SEO
        name: seo
        widget: object
        collapsed: true
        fields:
          - { label: SEO title, name: title, widget: string, required: false, hint: "Якщо порожньо — береться назва категорії" }
          - { label: SEO description, name: description, widget: text, required: false }
          - label: Robots
            name: robots
            widget: select
            options: ["index, follow", "noindex, nofollow"]
            default: "index, follow"
            required: false
