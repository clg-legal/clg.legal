baseURL = 'https://clg.legal/'
canonifyURLs = true
languageCode = 'uk-UA'
defaultContentLanguage = 'uk'
title = 'Concordis Legal Group'

[params]
  description = 'Юридичні консультації для бізнесу та приватних осіб. Професійний юридичний захист від Concordis Legal Group.'

[[menus.main]]
  name = 'Головна'
  url = '/'
  weight = 1

[[menus.main]]
  name = 'Про нас'
  url = '/#about-us'
  weight = 2

[[menus.main]]
  name = 'Практика'
  url = '/#praktyky'
  weight = 3

[[menus.main]]
  name = 'Публікації'
  url = '/blog/'
  weight = 4

[[menus.main]]
  name = 'Команда'
  url = '/#team'
  weight = 5

[[menus.main]]
  name = 'Контакти'
  url = '/contacts/'
  weight = 6

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

disableKinds = ["taxonomy"]

[taxonomies]
  category = "category"

[pagination]
  pagerSize = 12

[outputs]
  taxonomy = []

[[cascade]]
  [cascade._target]
    kind = "page"
    path = "/blog/**"
  [cascade.params]
    styles = ["pages/blog-post"]
    scripts = ["pages/blog-post"]
    bodyClass = "page-blog-post"

[[cascade]]
  [cascade._target]
    kind = "term"
    path = "/category/**"
  [cascade.params]
    styles = ["pages/blog"]
    bodyClass = "page-blog"

# Netlify's form detection does not recognise unquoted attributes (data-netlify=true) in minified HTML.
[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepQuotes = true
