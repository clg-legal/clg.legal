baseURL = 'https://clg.legal/'
canonifyURLs = true
languageCode = 'uk-UA'
defaultContentLanguage = 'uk'
title = 'Concordis Legal Group'

[params]
  description = 'Юридичні консультації для бізнесу та приватних осіб. Професійний юридичний захист від Concordis Legal Group.'
  phonePrimary = '+380501055115'
  phonePrimaryDisplay = '+38 (050) 105-51-15'
  phoneSecondary = '+380442225511'
  phoneSecondaryDisplay = '+38 (044) 222-55-11'
  address = '01010, м.Київ, вул. І.Мазепи, б. 11а, офіс 21, 3 поверх'
  addressLines = ['01010, м.Київ,', 'вул. І.Мазепи, б. 11а,', 'офіс 21, 3 поверх']
  addressUrl = 'https://www.google.com/maps/dir/?api=1&destination=Київ,+Івана+Мазепи+11а'
  mapEmbedUrl = 'https://maps.google.com/maps?q=01010%2C%20%D0%BC.%20%D0%9A%D0%B8%D1%97%D0%B2%2C%20%D0%B2%D1%83%D0%BB.%20%D0%9C%D0%B0%D0%B7%D0%B5%D0%BF%D0%B8%2C%2011%D0%B0%2C%20%D0%BE%D1%84%D1%96%D1%81%2021%2C%203%20%D0%BF%D0%BE%D0%B2%D0%B5%D1%80%D1%85&t=m&z=15&output=embed&iwloc=near'
  email = 'office@clg.legal'

[[menus.main]]
  name = 'Головна'
  url = '/'
  weight = 1

[[menus.main]]
  name = 'Про нас'
  url = '/#about-us'
  weight = 2

[[menus.main]]
  name = 'Практика'
  url = '/#praktyky'
  weight = 3

[[menus.main]]
  name = 'Публікації'
  url = '/blog/'
  weight = 4

[[menus.main]]
  name = 'Команда'
  url = '/#team'
  weight = 5

[[menus.main]]
  name = 'Контакти'
  url = '/contacts/'
  weight = 6

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

disableKinds = ["taxonomy"]

[taxonomies]
  category = "category"

[pagination]
  pagerSize = 9

[outputs]
  taxonomy = []

[[cascade]]
  [cascade._target]
    kind = "page"
    path = "/blog/**"
  [cascade.params]
    styles = ["pages/blog-post"]
    scripts = ["pages/blog-post"]
    bodyClass = "page-blog-post"

[[cascade]]
  [cascade._target]
    kind = "term"
    path = "/category/**"
  [cascade.params]
    styles = ["pages/blog"]
    bodyClass = "page-blog"
