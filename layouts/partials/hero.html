{{ $hero := .Params.hero }}
<section class="hero" aria-labelledby="hero-title">
  <div class="hero__background" aria-hidden="true">
    <div class="hero__background-media hero__background-media--mobile"></div>
    <div class="hero__background-desktop">
      <div class="hero__background-shape"></div>
      <div class="hero__background-photo"></div>
    </div>
    <div class="hero__overlay"></div>
  </div>

  <div class="hero__container">
    <div class="hero__content">
      <div class="hero__badge">
        <img
          class="hero__badge-icon"
          src="{{ "/images/badge-icon.png" | relURL }}"
          width="29"
          height="25"
          alt=""
          decoding="async"
        />
        <p class="hero__badge-text">{{ $hero.badge }}</p>
      </div>

      <h1 class="hero__title" id="hero-title">{{ $hero.title }}</h1>

      <p class="hero__description">
        <strong>{{ $hero.brand }}</strong> {{ $hero.lead }}
      </p>

      <div class="hero__consultation" id="consultation">
        <h2 class="hero__consultation-title">{{ $hero.consultationTitle }}</h2>
        <p class="hero__consultation-text">{{ $hero.consultationText }}</p>
      </div>

      <form
        class="hero__form"
        name="hero-callback"
            method="post"
        netlify
        netlify-honeypot="bot-field"
        data-hero-form
        data-success="{{ site.Data.contact_form.successText }}"
        data-error="{{ site.Data.contact_form.errorText }}"
        novalidate
      >
        <input type="hidden" name="form-name" value="hero-callback" />
        <input type="hidden" name="page" value="" />
        <p class="visually-hidden" aria-hidden="true">
          <label>Не заповнюйте це поле: <input name="bot-field" tabindex="-1" autocomplete="off" /></label>
        </p>
        <label class="visually-hidden" for="hero-phone">Номер телефону</label>
        <input
          class="hero__input"
          id="hero-phone"
          type="tel"
          name="phone"
          inputmode="tel"
          autocomplete="tel"
          placeholder="{{ $hero.formPlaceholder }}"
          required
        />
        <button class="hero__submit btn btn--light" type="submit">
          {{ $hero.formSubmit }}
        </button>
        <p class="form-status" role="status" aria-live="polite" data-form-status hidden></p>
      </form>
    </div>
  </div>
</section>
