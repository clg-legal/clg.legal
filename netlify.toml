[build]
  publish = "public"
  command = "hugo --gc --minify -b $URL"

[build.environment]
  HUGO_VERSION = "0.148.2"
  HUGO_ENVIRONMENT = "production"
  TZ = "Europe/Kyiv"

[context.deploy-preview]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# Кешування в браузері. Правила не перетинаються (поведінка Netlify при перетині для одного заголовка не задокументована):
# картинки — 15 хв, усе інше (HTML-сторінки, CSS/JS, шрифти, sitemap) — 1 год. HTML-сторінки — це "/" та pretty URL "/<...>/".
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*/"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=900"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=900"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=900"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=900"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=900"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=900"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=900"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=900"

